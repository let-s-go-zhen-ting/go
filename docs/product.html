<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>商品詳情</title>
  <link rel="stylesheet" href="assets/ui.css">
  

  <!-- Favicon / PWA icons -->
<link rel="icon" type="image/png" href="favicon.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">

</head>
<body>
  <div class="header-bar simple">
    <!-- 左邊：啦此購 logo（點它回首頁） -->
    <a class="corner-brand" href="index.html">
      <img src="favicon.png" alt="logo">
      <div>
        <div class="brand-zh">啦此購</div>
        <div class="brand-en">Let's Go！！！</div>
      </div>
    </a>

    <!-- 中間：上一頁 + 商品名 -->
    <button class="btn sm secondary" type="button"
            onclick="history.back();">上一頁
    </button>

    <h1 class="page-title sm" id="title">商品</h1>

    <!-- 右邊：購物車／結帳 + 數量 + 我 -->
    <div class="cart-group">
      <a href="checkout.html" class="btn sm secondary">購物車/結帳</a>
      <span class="badge" id="cartCount">0</span>
      <button id="avatarBtn" class="avatar" aria-label="開啟個人選單">我</button>
    </div>
  </div>

  <main>
  <section id="box">載入中…</section>

  <script type="module">
  import {
    initProducts, PRODUCTS, setCart, getCart, addToCartById, pushRecent
  } from './assets/app.js?v=8';

  await initProducts('1BDw71gFOYp0e2kqOZFkfbV5v1dgC99kgwUEaHwjvxTk','商品');
  setCart(getCart());

  const fmt = n => Number(n || 0).toLocaleString('zh-Hant-TW');
  const id  = new URLSearchParams(location.search).get('id') || '';
  const p   = PRODUCTS.find(x => x.id === id);
  const box = document.getElementById('box');

  if (!p) {
    box.innerHTML = `<div class="small">找不到此商品（ID: ${id}）。</div>`;
  } else {
    pushRecent(p.id);

    // 頁面最上方的標題
    document.getElementById('title').textContent = p.title;

    const isNew      = !!p.isNew;
    const isPreorder = !!p.isPreorder;
    const stock      = (p.stock ?? 0);
    const baseUnitPrice = Number(p.price || 0);

    box.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:16px">

        <!-- 圖片在最上面 -->
        <div>
          ${p.image
            ? `<img src="${p.image}" alt="${p.title}"
                    style="width:100%;border-radius:12px;object-fit:cover;aspect-ratio:1/1;">`
            : ''
          }
        </div>

        <!-- 文字全部在圖片下面 -->
        <div>
          <!-- 商品名稱 -->
          <h2 style="margin:0 0 4px 0;font-size:20px;">
            ${p.title}
          </h2>

          <!-- NEW / 預購 標籤：放在標題和分類中間 -->
          <div style="margin:0 0 4px 0">
            ${isNew ? '<span class="badge new">NEW</span>' : ''}
            ${isPreorder ? '<span class="badge preorder">預購</span>' : ''}
          </div>

          <!-- 分類 -->
          <div class="small" style="margin-bottom:4px">
            分類：${p.category || '其他'}
          </div>

          <!-- 預計出貨（如果有預購） -->
          ${isPreorder && p.eta
            ? `<div class="small" style="margin-bottom:8px">預計出貨：${p.eta}</div>`
            : ''
          }

          <!-- 選項：一個選項一個框框，放在「分類」跟「單價」中間 -->
          <div id="optBox" style="margin:4px 0 8px 0"></div>

          <!-- 單價 -->
          <div style="font-size:20px; font-weight:700; margin:4px 0">
            單價 NT$ <span id="unitPrice">0</span>
          </div>

          <!-- 庫存：放在單價跟數量選擇中間，不要框框 -->
          <div id="stockText" class="small" style="margin:4px 0 8px 0"></div>

          <!-- 數量 + 小計 -->
          <div class="row" style="align-items:center;margin-top:4px">
            <button class="btn secondary" id="qtyMinus" type="button">－</button>
            <input id="qtyInput" class="input" type="number" value="1" min="1" step="1"
                   style="width:80px;text-align:center">
            <button class="btn secondary" id="qtyPlus" type="button">＋</button>
            <div style="margin-left:auto;font-weight:700">
              小計 NT$ <span id="subtotal">0</span>
            </div>
          </div>

          <!-- 按鈕 -->
          <div class="row" style="margin-top:12px">
            <button class="btn" id="addBtn" ${stock <= 0 ? 'disabled' : ''}>加入購物車</button>
            <a class="btn secondary" href="checkout.html">前往結帳</a>
          </div>

          ${p.desc
            ? `<div style="white-space:pre-wrap;margin-top:8px">${p.desc}</div>`
            : ''
          }
        </div>
      </div>
    `;

    // ===== 下面是互動邏輯 =====
    const unitPriceEl = document.getElementById('unitPrice');
    const subtotalEl  = document.getElementById('subtotal');
    const qtyInput    = document.getElementById('qtyInput');
    const qtyMinusBtn = document.getElementById('qtyMinus');
    const qtyPlusBtn  = document.getElementById('qtyPlus');
    const optBox      = document.getElementById('optBox');
    const addBtn      = document.getElementById('addBtn');
    const stockTextEl = document.getElementById('stockText');

    unitPriceEl.textContent = fmt(baseUnitPrice);

    // 庫存顯示（不加框）
    if (stock > 0) {
      stockTextEl.textContent = `庫存 ${stock}`;
    } else {
      stockTextEl.textContent = '缺貨';
      stockTextEl.style.color = '#b91c1c';
    }

    // ------- 選項：一個選項一個框框 -------
    let currentOption = null;

    function renderOptions() {
      const raw = p.options || p.option || '';
      if (!raw) return;

      const parts = String(raw)
        .split(/[\/,]/)
        .map(s => s.trim())
        .filter(Boolean);

      if (!parts.length) return;

      optBox.innerHTML = `
        <div class="small" style="margin-bottom:4px">選項：</div>
        <div id="optionList"
             class="row"
             style="flex-wrap:wrap;gap:8px 8px;margin-top:4px">
          ${parts.map((v, i) => `
            <button type="button"
                    class="btn secondary optBtn ${i === 0 ? 'is-active' : ''}"
                    data-value="${v}">
              ${v}
            </button>
          `).join('')}
        </div>
      `;

      const btns = Array.from(optBox.querySelectorAll('.optBtn'));
      if (btns.length) {
        currentOption = btns[0].dataset.value;
      }

      btns.forEach(btn => {
        btn.addEventListener('click', () => {
          btns.forEach(b => b.classList.remove('is-active'));
          btn.classList.add('is-active');
          currentOption = btn.dataset.value;
        });
      });
    }

    renderOptions();

    // 可以在 ui.css 裡加這個 class 讓選到的框框更明顯
    // .optBtn.is-active { border-width:2px; }

    // ------- 數量 & 小計 -------
    const maxStock = stock > 0 ? stock : 9999;

    function clampQty(n) {
      let q = Number(n || 1);
      if (!Number.isFinite(q) || q <= 0) q = 1;
      if (maxStock > 0) q = Math.min(q, maxStock);
      return q;
    }

    function updateSubtotal() {
      const qty = clampQty(qtyInput.value);
      qtyInput.value = qty;
      subtotalEl.textContent = fmt(baseUnitPrice * qty);
    }

    updateSubtotal();

    qtyMinusBtn?.addEventListener('click', () => {
      let q = clampQty(qtyInput.value);
      if (q > 1) q--;
      qtyInput.value = q;
      updateSubtotal();
    });

    qtyPlusBtn?.addEventListener('click', () => {
      let q = clampQty(qtyInput.value);
      q++;
      qtyInput.value = q;
      updateSubtotal();
    });

    qtyInput?.addEventListener('input', () => {
      updateSubtotal();
    });

    // ------- 加入購物車 -------
    addBtn?.addEventListener('click', () => {
      const qty = clampQty(qtyInput.value);

      // 目前先沒把選項塞進 cart，只是照數量加同一個商品
      for (let i = 0; i < qty; i++) {
        addToCartById(p.id);
      }

      setCart(getCart());
      // 之後如果要「選項 + 價格 + 顯示在購物車」，再一起改 app.js
    });
  }
</script>
