<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

    </div>
  </div>
  
  <header>
    <div><a class="btn secondary" href="index.html">← 回商店</a></div>
    <h1 id="title" style="margin-left:12px">商品</h1>
    <div style="margin-left:auto">
      <a href="checkout.html" class="btn secondary">購物車/結帳</a>
      <span class="badge" id="cartCount">0</span>
    </div>
  </header>

  <main>
  <section class="card" id="box">載入中…</section>

  <script type="module">
  import {
    initProducts, PRODUCTS, setCart, getCart, addToCartById, pushRecent
  } from './assets/app.js?v=8';

  // 請換成你的試算表 ID & 分頁名
  await initProducts('1BDw71gFOYp0e2kqOZFkfbV5v1dgC99kgwUEaHwjvxTk','商品');
  setCart(getCart());

  const fmt = n => Number(n || 0).toLocaleString('zh-Hant-TW');
  const id  = new URLSearchParams(location.search).get('id') || '';
  const p   = PRODUCTS.find(x => x.id === id);
  const box = document.getElementById('box');

  if (!p) {
    box.innerHTML = `<div class="small">找不到此商品（ID: ${id}）。</div>`;
  } else {
    pushRecent(p.id);

    document.getElementById('title').textContent = p.title;

    box.innerHTML = `
      <div class="row" style="gap:16px; align-items:flex-start; flex-wrap:wrap">
        <div style="flex:1; min-width:280px">
          ${p.image
            ? `<img src="${p.image}" alt="${p.title}" style="width:100%;border-radius:12px;object-fit:cover;aspect-ratio:1/1;">`
            : ''
          }
        </div>

        <div style="flex:1; min-width:260px">
          <h2 style="margin:0 0 8px 0">
            ${p.title}
            ${p.isNew ? '<span class="badge new">NEW</span>' : ''}
            ${p.isPreorder ? '<span class="badge preorder">預購</span>' : ''}
          </h2>
          ${p.isPreorder && p.eta ? `<div class="small" style="margin-bottom:4px">預計出貨：${p.eta}</div>` : ''}
          <div class="small" style="margin-bottom:6px">分類：${p.category || '其他'}</div>

          <!-- 單價 -->
          <div style="font-size:20px; font-weight:700; margin:8px 0">
            單價 NT$ <span id="unitPrice">0</span>
          </div>

          <!-- 動態選項會插到這裡 -->
          <div id="optBox" style="margin:8px 0"></div>

          <!-- 數量 + 小計 -->
          <div class="row" style="align-items:center;margin-top:8px">
            <button class="btn secondary" id="qtyMinus" type="button">－</button>
            <input id="qtyInput" class="input" type="number" value="1" min="1" step="1"
                   style="width:80px;text-align:center">
            <button class="btn secondary" id="qtyPlus" type="button">＋</button>
            <div style="margin-left:auto;font-weight:700">
              小計 NT$ <span id="subtotal">0</span>
            </div>
          </div>

          <!-- 庫存狀態 -->
          <div style="margin:6px 0">
            ${(p.stock ?? 0) > 0
              ? `<span class="badge">庫存 ${p.stock}</span>`
              : `<span class="badge" style="border-color:#b91c1c;color:#b91c1c">缺貨</span>`}
          </div>

          <!-- 按鈕 -->
          <div class="row" style="margin-top:12px">
            <button class="btn" id="addBtn" ${(p.stock ?? 0) <= 0 ? 'disabled' : ''}>加入購物車</button>
            <a class="btn secondary" href="checkout.html">前往結帳</a>
          </div>

          ${p.desc ? `<div style="white-space:pre-wrap;margin-top:8px">${p.desc}</div>` : ''}
        </div>
      </div>
    `;

    // ===== 這裡開始是「選項 + 數量 + 小計 + 加入購物車」的 JS =====

    const unitPriceEl = document.getElementById('unitPrice');
    const subtotalEl  = document.getElementById('subtotal');
    const qtyInput    = document.getElementById('qtyInput');
    const qtyMinusBtn = document.getElementById('qtyMinus');
    const qtyPlusBtn  = document.getElementById('qtyPlus');
    const optBox      = document.getElementById('optBox');
    const addBtn      = document.getElementById('addBtn');

    // 單價（先用 p.price，之後如果要做「不同選項不同價」，再改這裡）
    const baseUnitPrice = Number(p.price || 0);
    const maxStock = (p.stock ?? 9999); // 有填庫存就限制，沒填就當無限

    unitPriceEl.textContent = fmt(baseUnitPrice);

    // 如果你有「選項」欄位（例如試算表有一欄叫 options ，內容：A版/B版/C版）
    // 這段會把它拆成下拉選單，暫時不影響價格，只是讓客人選
    function renderOptions() {
      // 假設 p.options 是用「/」或「,」分隔，例如：A版/B版/C版
      const raw = p.options || p.option || ''; // 任選一個你實際有用的欄位名稱
      if (!raw) return;

      const parts = String(raw)
        .split(/[\/,]/)
        .map(s => s.trim())
        .filter(Boolean);

      if (!parts.length) return;

      optBox.innerHTML = `
        <label class="small" style="display:block;margin-bottom:4px">
          選項：
          <select id="optionSelect" class="input" style="margin-top:4px">
            ${parts.map(v => `<option value="${v}">${v}</option>`).join('')}
          </select>
        </label>
      `;
    }

    renderOptions();

    function clampQty(n) {
      let q = Number(n || 1);
      if (!Number.isFinite(q) || q <= 0) q = 1;
      if (maxStock > 0) q = Math.min(q, maxStock);
      return q;
    }

    function updateSubtotal() {
      const qty = clampQty(qtyInput.value);
      qtyInput.value = qty;
      subtotalEl.textContent = fmt(baseUnitPrice * qty);
    }

    // 一開始先算一次
    updateSubtotal();

    // 數量按鈕
    qtyMinusBtn?.addEventListener('click', () => {
      let q = clampQty(qtyInput.value);
      if (q > 1) q--;
      qtyInput.value = q;
      updateSubtotal();
    });

    qtyPlusBtn?.addEventListener('click', () => {
      let q = clampQty(qtyInput.value);
      q++;
      qtyInput.value = q;
      updateSubtotal();
    });

    // 手動輸入數量
    qtyInput?.addEventListener('input', () => {
      updateSubtotal();
    });

    // 加入購物車
    addBtn?.addEventListener('click', () => {
      const qty = clampQty(qtyInput.value);

      // 如果之後要把「選項」也存進購物車，就要改 addToCartById 的實作。
      // 現在先簡單做：依照數量多次加入同一個商品。
      for (let i = 0; i < qty; i++) {
        addToCartById(p.id);
      }

      setCart(getCart());
      // 這裡如果你想加「已加入購物車」的小提示也可以再補
    });
  }
</script>
