        <div class="brand-zh">啦此購</div>

      </div>

    <h1 class="page-title sm" id="title">商品</h1>

    <!-- 右邊：購物車／結帳 + 數量 + 我 -->

  </div>

  <main>
  <section id="box">載入中…</section>

  <script type="module">
  import {
    initProducts, PRODUCTS, setCart, getCart,
    addToCartById, pushRecent, setupDrawer
  } from './assets/app.js?v=8';

  await initProducts('1BDw71gFOYp0e2kqOZFkfbV5v1dgC99kgwUEaHwjvxTk','商品');
  setCart(getCart());

  const fmt = n => Number(n || 0).toLocaleString('zh-Hant-TW');
  const id  = new URLSearchParams(location.search).get('id') || '';
  const p   = PRODUCTS.find(x => x.id === id);
  const box = document.getElementById('box');

  if (!p) {
    box.innerHTML = `<div class="small">找不到此商品（ID: ${id}）。</div>`;
  } else {
    pushRecent(p.id);

    // 頁面最上方的標題
    document.getElementById('title').textContent = p.title;
    document.title = p.title + "｜啦此購";


    const isNew      = !!p.isNew;
const isPreorder = !!p.isPreorder;
const stock      = (p.stock ?? 0);  // 之後 computeMaxStock 會用到

// 共用：把 "A/B/C" 或 "A,B,C" 轉成 ["A","B","C"]
const splitList = (raw) => String(raw || '')
  .split(/[\/／,，]/)
  .map(s => s.trim())
  .filter(Boolean);

// 三個對應陣列（從試算表欄位來）
const optionNames  = splitList(p.options);
const optionPrices = splitList(p.optionPrices).map(x => Number(x || 0));
const optionStocks = splitList(p.optionStocks).map(x => Number(x || 0));

// 目前選到第幾個選項（index）
let currentOptionIndex = 0;

// 目前的單價 & 庫存上限（會隨選項改變）
let currentUnitPrice = Number(p.price || 0);
let currentMaxStock  = (p.stock ?? 0) || 9999;


    box.innerHTML = `
      <div style="display:flex;flex-direction:column-reverse;gap:16px">

        <!-- 圖片在最上面 -->
        <div>
          ${p.image
            ? `<img src="${p.image}" alt="${p.title}"
                    style="width:100%;border-radius:12px;object-fit:cover;aspect-ratio:1/1;">`
            : ''
          }
        </div>

        <!-- 文字全部在圖片下面 -->
        <div>
          <!-- 商品名稱 -->
          <h2 style="margin:0 0 4px 0;font-size:20px;">
            ${p.title}
          </h2>

          <!-- NEW / 預購 標籤：放在標題和分類中間 -->
          <div style="margin:0 0 4px 0">
            ${isNew ? '<span class="badge new">NEW</span>' : ''}
            ${isPreorder ? '<span class="badge preorder">預購</span>' : ''}
          </div>

          <!-- 分類 -->
          <div class="small" style="margin-bottom:4px">
            分類：${p.category || '其他'}
          </div>

          <!-- 預計出貨（如果有預購） -->
          ${isPreorder && p.eta
            ? `<div class="small" style="margin-bottom:8px">預計出貨：${p.eta}</div>`
            : ''
          }

          <!-- 選項：一個選項一個框框，放在「分類」跟「單價」中間 -->
          <div id="optBox" style="margin:4px 0 8px 0"></div>

          <!-- 單價 -->
          <div style="font-size:20px; font-weight:700; margin:4px 0">
            單價 NT$ <span id="unitPrice">0</span>
          </div>

          <!-- 庫存：放在單價跟數量選擇中間，不要框框 -->
          <div id="stockText" class="small" style="margin:4px 0 8px 0"></div>

                    <!-- 數量 + 小計 + 按鈕，全部同一行 -->
          <div class="row" style="align-items:center;margin-top:8px;flex-wrap:wrap">

            <!-- 數量選擇 -->
            <div class="row" style="flex-wrap:nowrap;gap:8px">
              <button class="btn secondary" id="qtyMinus" type="button">－</button>
              <input id="qtyInput" class="input" type="number" value="1" min="1" step="1"
                     style="width:80px;text-align:center">
              <button class="btn secondary" id="qtyPlus" type="button">＋</button>
            </div>

            <!-- 小計：放在數量跟加入購物車中間 -->
            <div style="font-weight:700;margin-left:12px;">
              小計 NT$ <span id="subtotal">0</span>
            </div>

            <!-- 按鈕 -->
          <div class="row" style="margin-top:12px">
            <button class="btn" id="addBtn" ${stock <= 0 ? 'disabled' : ''}>加入購物車</button>
            <button class="btn secondary" id="buyNowBtn" type="button">前往結帳</button>
          </div>

          ${p.desc
            ? `<div style="white-space:pre-wrap;margin-top:8px">${p.desc}</div>`
            : ''
          }
        </div>
      </div>
    `;


    // ===== 下面是互動邏輯 =====
    const unitPriceEl = document.getElementById('unitPrice');
    const subtotalEl  = document.getElementById('subtotal');
    const qtyInput    = document.getElementById('qtyInput');
    const qtyMinusBtn = document.getElementById('qtyMinus');
    const qtyPlusBtn  = document.getElementById('qtyPlus');
    const optBox      = document.getElementById('optBox');
    const addBtn      = document.getElementById('addBtn');
    const buyNowBtn   = document.getElementById('buyNowBtn');
    const stockTextEl = document.getElementById('stockText');

    // 取得目前選項的單價／庫存（沒有就 fallback）
    function computeUnitPrice() {
      const v = optionPrices[currentOptionIndex];
      if (Number.isFinite(v) && v > 0) return v;
      return Number(p.price || 0);
    }

    function computeMaxStock() {
  // 1) 先看這個選項自己的庫存
  const vOpt = optionStocks[currentOptionIndex];
  if (Number.isFinite(vOpt) && vOpt >= 0) return vOpt;

  // 2) 沒填選項庫存，就看商品整體庫存
  const vBase = Number(p.stock ?? 0);
  if (Number.isFinite(vBase) && vBase >= 0) return vBase;

  // 3) 兩邊都沒填，才當成「幾乎無限」
  return Infinity;
}

function clampQty(n) {
  // 如果目前是缺貨，數量就固定為 0
  if (currentMaxStock <= 0) return 0;

  let q = Number(n || 1);
  if (!Number.isFinite(q) || q <= 0) q = 1;

  // 只有在「有庫存數字」時才限制上限
  if (Number.isFinite(currentMaxStock) && currentMaxStock > 0) {
    q = Math.min(q, currentMaxStock);
  }
  return q;
}



    function updateSubtotal() {
      const qty = clampQty(qtyInput.value);
      qtyInput.value = qty;
      subtotalEl.textContent = fmt(currentUnitPrice * qty);
    }

// ✅ 更新價格 + 庫存 + 按鈕狀態
function updatePriceAndStock() {
  currentUnitPrice = computeUnitPrice();
  currentMaxStock  = computeMaxStock();

  unitPriceEl.textContent = fmt(currentUnitPrice);

  if (currentMaxStock <= 0) {
    // ===== 缺貨狀態 =====
    stockTextEl.textContent = '缺貨';
    stockTextEl.style.color = '#b91c1c';
    addBtn.disabled = true;

    // 數量固定 0，且不能改
    qtyInput.value = 0;
    qtyInput.disabled = true;
    qtyMinusBtn.disabled = true;
    qtyPlusBtn.disabled = true;

    // 小計也變成 0
    subtotalEl.textContent = '0';
    return;
  }

  // ===== 有庫存狀態 =====
  addBtn.disabled = false;
  qtyInput.disabled = false;
  qtyMinusBtn.disabled = false;
  qtyPlusBtn.disabled = false;

  if (!Number.isFinite(currentMaxStock) || currentMaxStock >= 9999) {
    // 視為「庫存充足」
    stockTextEl.textContent = '庫存充足';
    stockTextEl.style.color = '#6b7280';
  } else {
    stockTextEl.textContent = `庫存 ${currentMaxStock}`;
    stockTextEl.style.color = '#6b7280';
  }

  // 如果之前是 0 或空值，幫他重設回 1
  let q = Number(qtyInput.value || 0);
  if (!Number.isFinite(q) || q <= 0) q = 1;
  qtyInput.value = clampQty(q);

  updateSubtotal();
}


    // ------- 選項：一個選項一個框框 -------
    function renderOptions() {
      // 如果沒有選項，就用全域價格/庫存初始化一次
      if (!optionNames.length) {
        updatePriceAndStock();
        return;
      }

      optBox.innerHTML = `
        <div class="small" style="margin-bottom:4px">選項：</div>
        <div id="optionList"
             class="row"
             style="flex-wrap:wrap;gap:8px 8px;margin-top:4px">
          ${optionNames.map((v, i) => `
            <button type="button"
                    class="btn secondary optBtn ${i === 0 ? 'is-active' : ''}"
                    data-index="${i}">
              ${v}
            </button>
          `).join('')}
        </div>
      `;

      const btns = Array.from(optBox.querySelectorAll('.optBtn'));
      if (btns.length) currentOptionIndex = 0;

      btns.forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.dataset.index || 0);
          currentOptionIndex = idx;

          btns.forEach(b => b.classList.remove('is-active'));
          btn.classList.add('is-active');

          updatePriceAndStock();
        });
      });

      // 初始跑一次，套用第 0 個選項
      updatePriceAndStock();
    }

    renderOptions();

    // ------- 數量 & 小計 -------
qtyMinusBtn?.addEventListener('click', () => {
  if (currentMaxStock <= 0) return; // 缺貨直接無效
  let q = clampQty(qtyInput.value);
  if (q > 1) q--;
  qtyInput.value = q;
  updateSubtotal();
});

qtyPlusBtn?.addEventListener('click', () => {
  if (currentMaxStock <= 0) return; // 缺貨直接無效
  let q = clampQty(qtyInput.value);
  q++;
  qtyInput.value = q;
  updateSubtotal();
});

qtyInput?.addEventListener('input', () => {
  updateSubtotal();
});

    // ------- 加入購物車 -------
    buyNowBtn?.addEventListener('click', () => {
  const qty = clampQty(qtyInput.value);
  if (qty <= 0) return; // 缺貨或數量 0 就不要動

  // 這裡做成「只用這次選的款式＋數量去結帳」→ 先清空購物車
  setCart([]); // 如果你想保留原本購物車，就把這行刪掉

  for (let i = 0; i < qty; i++) {
    addToCartById(p.id);
  }
  setCart(getCart());

  // 跳到結帳頁
  location.href = 'checkout.html';
});

  } // ← 這是 if (!p) 的 else 結尾
  setupDrawer();
</script>
